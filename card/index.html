<title>Jeffrey Utley - Digital Business Card</title><style>
:root{--gold:#CFB991;--ink:#0b0b0b;} *{box-sizing:border-box;}
body{margin:0;background:#f4f4f5;color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;display:flex;justify-content:center;padding:22px 14px 48px;}
.wrap{width:100%;max-width:430px;}
.card{width:100%;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:block;margin:0 0 14px;}
.btns{display:flex;flex-direction:column;gap:10px;margin:18px 0 26px;}
a.btn,button.btn{display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;border:0;cursor:pointer;font-size:16px;font-weight:600;padding:14px 16px;border-radius:11px;width:100%;}
.primary{background:var(--ink);color:var(--gold);} .ghost{background:#fff;color:var(--ink);border:1.5px solid #e3e3e6;}
.ghost:active,.primary:active{transform:translateY(1px);}
.qrbox{background:#fff;border:1.5px solid #eee;border-radius:14px;padding:18px;text-align:center;}
.qrbox img{width:232px;height:232px;image-rendering:pixelated;} .qrbox p{margin:10px 0 0;font-size:13px;color:#555;}
.foot{text-align:center;color:#8a8a8a;font-size:12px;margin-top:26px;} .gold{color:var(--gold);}
